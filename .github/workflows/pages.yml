name: Publish Top Snap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and apply approved version
        run: |
          mkdir -p public
          cat site-parts/*.part > public/index.html
          echo "ca259b97195ff7e56ce7099a11fcee5e5126b98241d189a554358ef7c165fb43  public/index.html" | sha256sum -c -
          python3 apply-reviewed-version.py public/index.html
          python3 swipe_mobile_patch.py public/index.html
          python3 headline_spacing_patch.py public/index.html
          grep -F 'syncHeadlineLineSpacing();' public/index.html
          grep -F 'y += 1.6;' public/index.html
          grep -F 'singleLineSublineOffset = 20' public/index.html
          grep -F 'const anchorFx = 0.5, anchorFy = 0.25;' public/index.html
          grep -F 'grid-template-columns:repeat(7,minmax(0,1fr))' public/index.html
          grep -F 'webkit-playsinline' public/index.html
          grep -F 'requestVideoFrameCallback' public/index.html
      - name: Save ready-to-download index.html in repository
        run: |
          cp public/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html is already up to date"
          else
            git commit -m "Update built index.html [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
