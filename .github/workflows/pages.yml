name: Publish Top Snap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble, verify, and apply reviewed updates
        run: |
          mkdir -p public
          cat site-parts/*.part > public/index.html
          echo "ca259b97195ff7e56ce7099a11fcee5e5126b98241d189a554358ef7c165fb43  public/index.html" | sha256sum -c -
          python3 deploy_patch.py public/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
