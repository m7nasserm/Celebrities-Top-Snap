name: Publish Top Snap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify site
        run: |
          mkdir -p public
          cat site-parts/*.part > public/index.html
          echo "aba6192f0c21dc081f40b49acee3db5a7376279b69dd0a7d270ffa4aa00bc7c7  public/index.html" | sha256sum -c -
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
